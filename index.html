<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f1">
  <meta name="description" content="Meander — tactile tufted rugs and wall objects by Kasia, an artist from Poland.">
  <title>Meander — Art for your floor and walls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f4f1; --ink:#393b32; --purple:#45347f; --sage:#d8dac9; --pink:#e772a7; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"DM Sans",Arial,sans-serif; }
    a { color:inherit; }
    .hero { min-height:min(56vw,720px); height:56vw; max-height:720px; position:relative; overflow:hidden; display:grid; place-items:center; background:#d58eae; }
    .hero-art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .nav { position:absolute; z-index:2; top:0; right:0; left:0; display:flex; align-items:center; justify-content:flex-end; gap:clamp(18px,4vw,60px); padding:20px 3.2%; color:white; font-size:13px; }
    .nav a { text-decoration:none; text-shadow:0 1px 8px #714b70; }
    .brand { position:absolute; left:3.2%; font-weight:600; letter-spacing:.16em; text-transform:uppercase; }
    .pill { display:inline-flex; align-items:center; gap:12px; padding:9px 17px; border-radius:999px; background:#f5f4f1; color:#3f3477; text-decoration:none; font-size:12px; font-weight:600; box-shadow:0 3px 14px #311d4b20; transition:transform .2s ease,background .2s ease; }
    .pill:hover { transform:translateY(-2px); background:white; }
    .hero .pill { position:absolute; z-index:2; bottom:9%; left:50%; transform:translateX(-50%); }
    .products { display:grid; grid-template-columns:1fr 1.06fr; min-height:480px; }
    .product-photo { position:relative; min-height:480px; overflow:hidden; }
    .product-photo img { position:absolute; width:100%; height:100%; object-fit:cover; }
    .product-photo .pill { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); }
    .product-feature { position:relative; background:var(--purple); color:#f8efff; display:grid; place-items:center; padding:36px; min-height:480px; }
    .feature-item { display:flex; align-items:flex-end; gap:10px; }
    .feature-item img { width:min(35vw,205px); border-radius:2px; mix-blend-mode:screen; }
    .feature-copy { font-size:11px; line-height:1.35; padding-bottom:3px; }
    .secondary-product { position:absolute; bottom:12px; left:12px; }
    .feature-buy { position:absolute; bottom:14%; left:50%; transform:translateX(-50%); }
    .about-room { display:grid; grid-template-columns:32% 68%; min-height:540px; }
    .about-copy { background:var(--sage); padding:50px clamp(24px,4vw,70px); display:flex; flex-direction:column; justify-content:center; font-size:clamp(13px,1.25vw,17px); line-height:1.45; color:#7973a1; }
    .about-copy p { max-width:310px; margin:0 0 26px; }
    .about-copy p:last-child { margin-bottom:0; }
    .about-room figure { margin:0; min-height:540px; }
    .about-room figure img { width:100%; height:100%; object-fit:cover; }
    .objects { min-height:360px; display:flex; justify-content:center; align-items:center; gap:clamp(28px,6vw,90px); padding:54px 8%; flex-wrap:wrap; }
    .object-card { width:clamp(105px,15vw,190px); aspect-ratio:1; border-radius:25px; display:grid; place-items:center; background:#f1f0ee; overflow:hidden; }
    .object-card:nth-child(2) { width:clamp(150px,23vw,270px); background:#efeeee; }
    .object-card img { width:82%; height:82%; object-fit:contain; }
    .object-card a { display:grid; place-items:center; width:100%; height:100%; }
    .object-card figcaption { width:100%; padding:0 10px 12px; text-align:center; color:#7973a1; font-size:12px; }
    .artist { display:grid; grid-template-columns:40% 60%; min-height:500px; }
    .artist-photo { min-height:500px; background:linear-gradient(155deg,#e6dfea,#f5f4f1); display:grid; place-items:center; overflow:hidden; }
    .artist-photo img { width:100%; height:100%; object-fit:cover; }
    .artist-copy { padding:clamp(34px,7vw,100px); display:flex; flex-direction:column; justify-content:center; line-height:1.6; font-size:clamp(15px,1.45vw,19px); }
    .artist-copy p { max-width:580px; margin:0 0 16px; }
    .artist-copy a { text-decoration-thickness:1px; text-underline-offset:3px; }
    .video-section { padding:clamp(46px,8vw,110px) clamp(20px,8vw,120px); text-align:center; }
    .video-section:nth-of-type(even) { background:#eeedf1; }
    .video-heading { margin:0 0 12px; color:#7973a1; font-size:clamp(21px,3vw,34px); font-weight:500; }
    .video-intro { margin:0 auto 28px; color:#77766f; font-size:14px; }
    .video-frame { width:min(100%,1000px); margin:0 auto; aspect-ratio:16/9; overflow:hidden; border-radius:18px; background:#e8e5e9; box-shadow:0 12px 40px #393b3218; }
    .video-frame iframe { display:block; width:100%; height:100%; border:0; }
    footer { min-height:230px; background:#393b32; color:#f0edf0; text-align:center; display:flex; justify-content:center; align-items:center; }
    .contact h2 { margin:0 0 28px; font-size:12px; font-weight:500; letter-spacing:.04em; }
    .contact p { margin:4px; font-size:13px; }
    .contact a { text-decoration:none; }
    .loading-message { padding:4rem 1.5rem; text-align:center; }
    @media (max-width:700px) {
      .hero { height:86vw; min-height:390px; }
      .nav { gap:14px; padding:17px 14px; font-size:11px; }
      .brand { display:none; }
      .products { grid-template-columns:1fr; }
      .product-photo { min-height:82vw; }
      .product-feature { min-height:390px; }
      .feature-item img { width:190px; }
      .about-room { grid-template-columns:1fr; }
      .about-copy { min-height:300px; padding:40px 9%; }
      .about-copy p { max-width:520px; }
      .about-room figure { min-height:68vw; }
      .objects { min-height:270px; gap:14px; padding:32px 15px; }
      .object-card { width:26vw; border-radius:17px; }
      .object-card:nth-child(2) { width:37vw; }
      .artist { grid-template-columns:1fr; }
      .artist-photo { min-height:100vw; }
      .artist-copy { min-height:330px; padding:42px 9%; }
    }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } *,*::before,*::after { transition:none !important; } }
  </style>
  <script src="js/site.js" defer></script>
</head>
<body>
  <div id="site-root"><p class="loading-message">Loading the site…</p></div>
  <noscript>This site needs JavaScript enabled to display its content.</noscript>
</body>
</html>
